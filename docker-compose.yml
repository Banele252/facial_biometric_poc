services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: facial-biometric-api:local
    container_name: facial-biometric-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      APP_ENV: development
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:////app/data/facial_biometric.db
      SELFIE_STORAGE_DIR: /app/data/selfies
      CORS_ALLOW_ORIGINS: "http://localhost:8081,http://localhost:19006,http://127.0.0.1:8081,http://127.0.0.1:19006"

    volumes:
      - biometric_data:/app/data

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - biometric_net

  redis:
    image: redis:8.2-alpine
    container_name: facial-biometric-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - biometric_net

volumes:
  biometric_data:
  redis_data:

networks:
  biometric_net:
    driver: bridge