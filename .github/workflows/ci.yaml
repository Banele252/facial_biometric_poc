name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Cancel superseded runs on the same PR — the last push is the one that matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend — lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.29'
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Ruff — lint
        run: uv run ruff check --output-format=github .

      - name: Ruff — format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 7

  frontend:
    name: Frontend — lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing happens in the CD workflow after gates pass.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: facial-biometric-poc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 facial-biometric-poc:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then
              echo "healthz OK"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::container did not become healthy"
              docker logs smoke
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/readyz
          # The SPA bundle must be served from the same container.
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          curl -fsS -X POST http://localhost:8000/api/v1/validate-id \
            -H 'Content-Type: application/json' \
            -d '{"id_number":"9001015001083"}' | grep -q '"valid":true'

      - name: Container logs
        if: failure()
        run: docker logs smoke

      - name: Tear down
        if: always()
        run: docker rm -f smoke || true
