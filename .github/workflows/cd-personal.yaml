name: CD (personal subscription)

# Deploys to the personal Azure subscription. Unlike cd.yaml (one enterprise
# Container App, one image, infra provisioned separately), this workflow is
# fully self-provisioning: it creates the resource group, App Service Plan
# and Container Registry itself if they don't exist yet, then creates the
# target service's own Web App the first time that service is deployed.
# Nothing about infra is pre-registered per service or tracked as separate
# GitHub config — the only things that have to exist before this workflow
# can run at all are the OIDC identity and its RBAC grants (see
# infra-personal/bootstrap.sh), because a pipeline can't grant itself its
# own first credential. Everything downstream of that is self-healing: if a
# resource is ever deleted or this runs against a fresh subscription, the
# next run just recreates it.
#
# Runs only via workflow_dispatch, from whichever branch you pick in the
# "Run workflow" UI (the workflow file has to already exist on that branch).
# service_path takes any folder with its own Dockerfile — "root" for the
# top-level app, or e.g. "Backend/my_new_service" for anything else. Running
# from a non-main branch deploys to a SEPARATE Web App suffixed with the
# branch name (see "Resolve service" below) — two people testing the same
# service folder on different branches never land on the same Web App, and
# a branch deploy never touches the one main produces.
#
# OIDC trust (see infra-personal/bootstrap.sh) is scoped to a GitHub
# Environment claim, not a branch ref — Azure federated credentials don't
# support wildcards, so a branch-ref subject would only ever work from one
# named branch. `environment: personal` below is what attaches that claim
# to the token regardless of which branch the run is on.
#
# New services must serve a GET /health returning 2xx (the same convention
# Backend/rica_service, sim_swap_service, fraud_engine and internal_backend
# already follow) — that's what the health-check step polls.
#
# Requires (see infra-personal/bootstrap.sh, which sets these) — this is
# deliberately the entire list, and there is no separate list of GitHub
# repo variables to keep in sync:
#   secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# AZURE_NAME_PREFIX/AZURE_RESOURCE_GROUP/AZURE_LOCATION below must match
# what bootstrap.sh was run with — it's the one thing bootstrap.sh and this
# file each hardcode independently rather than sharing, since nothing else
# in this workflow can safely learn "which resource group" any other way
# before it's authenticated.
#
# Anything a service itself needs (a database URL, an API key, ...) is never
# handled here — push it to that service's Web App by hand
# (`az webapp config appsettings set`) after it exists. See
# infra-personal/README.md.

on:
  workflow_dispatch:
    inputs:
      service_path:
        description: >-
          Folder containing the service's Dockerfile, relative to repo root
          (e.g. Backend/my_new_service). Use "root" for the top-level app.
        required: true
        type: string
        default: root

concurrency:
  group: cd-personal-${{ github.event.inputs.service_path || 'root' }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AZURE_NAME_PREFIX: fbio
  AZURE_RESOURCE_GROUP: rg-fbio-personal
  AZURE_LOCATION: southafricanorth

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: personal
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve service
        id: resolve
        env:
          SERVICE_PATH_INPUT: ${{ github.event.inputs.service_path }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          SERVICE_PATH="${SERVICE_PATH_INPUT%/}"

          if [ "$SERVICE_PATH" = "root" ]; then
            DOCKERFILE="Dockerfile"
            RAW_NAME="app"
            HEALTH_PATH="/healthz"
          else
            DOCKERFILE="${SERVICE_PATH}/Dockerfile"
            RAW_NAME="$(basename "$SERVICE_PATH")"
            HEALTH_PATH="/health"
          fi

          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error::No Dockerfile at '${DOCKERFILE}'. Add one first — see Backend/rica_service/Dockerfile for the pattern standalone services in this repo follow (build context is the repo root, so pyproject.toml/uv.lock and Backend/__init__.py stay reachable)."
            exit 1
          fi

          # Web App names: lowercase letters/digits/hyphens only, no
          # leading/trailing hyphen. A run from any branch other than main
          # gets its own, branch-suffixed Web App — deploying a feature
          # branch's version of a service never overwrites main's.
          sanitize() {
            echo "$1" | tr '[:upper:]_' '[:lower:]-' | tr -cs 'a-z0-9-' '-' | sed -e 's/^-*//' -e 's/-*$//'
          }
          SERVICE_NAME="$(sanitize "$RAW_NAME")"
          if [ -z "$SERVICE_NAME" ]; then
            echo "::error::Could not derive a valid service name from '${SERVICE_PATH}'."
            exit 1
          fi
          if [ "$BRANCH" != "main" ]; then
            SERVICE_NAME="${SERVICE_NAME}-$(sanitize "$BRANCH")"
          fi
          WEBAPP_NAME="$(echo "${{ env.AZURE_NAME_PREFIX }}-${SERVICE_NAME}" | cut -c1-55 | sed -e 's/-*$//')"

          {
            echo "dockerfile=${DOCKERFILE}"
            echo "service_name=${SERVICE_NAME}"
            echo "webapp_name=${WEBAPP_NAME}"
            echo "health_path=${HEALTH_PATH}"
          } >> "$GITHUB_OUTPUT"
          echo "### Deploying \`${SERVICE_PATH}\` (branch \`${BRANCH}\`) -> ${WEBAPP_NAME}" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure shared infra exists (resource group, plan, ACR)
        id: infra
        run: |
          set -euo pipefail
          RG="${{ env.AZURE_RESOURCE_GROUP }}"

          if ! az group show --name "$RG" -o none 2>/dev/null; then
            echo "Creating resource group $RG..."
            az group create --name "$RG" --location "${{ env.AZURE_LOCATION }}" -o none
          fi

          PLAN_NAME="${{ env.AZURE_NAME_PREFIX }}-plan"
          if ! az appservice plan show --name "$PLAN_NAME" --resource-group "$RG" -o none 2>/dev/null; then
            echo "Creating App Service Plan $PLAN_NAME..."
            az appservice plan create \
              --name "$PLAN_NAME" --resource-group "$RG" \
              --location "${{ env.AZURE_LOCATION }}" --is-linux --sku B1 -o none
          fi

          # ACR names are globally unique across all of Azure, not just this
          # subscription, so a fixed short name risks colliding with someone
          # else's registry. Deriving the suffix from the subscription ID
          # keeps the name both deterministic (same name every run) and
          # collision-resistant, without persisting it anywhere.
          SUB_ID="$(az account show --query id -o tsv)"
          ACR_NAME="${{ env.AZURE_NAME_PREFIX }}acr$(echo -n "$SUB_ID" | sha256sum | cut -c1-8)"
          if ! az acr show --name "$ACR_NAME" -o none 2>/dev/null; then
            echo "Creating Container Registry $ACR_NAME..."
            az acr create --name "$ACR_NAME" --resource-group "$RG" --sku Basic --admin-enabled false -o none
          fi
          ACR_ID="$(az acr show --name "$ACR_NAME" --query id -o tsv)"
          ACR_LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"

          {
            echo "plan_name=${PLAN_NAME}"
            echo "acr_name=${ACR_NAME}"
            echo "acr_id=${ACR_ID}"
            echo "acr_login_server=${ACR_LOGIN_SERVER}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.resolve.outputs.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.infra.outputs.acr_login_server }}/${{ steps.resolve.outputs.service_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.resolve.outputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ steps.resolve.outputs.service_name }}
          provenance: false

      - name: Push image
        run: |
          set -euo pipefail
          az acr login --name "${{ steps.infra.outputs.acr_name }}"
          IMAGE="${{ steps.infra.outputs.acr_login_server }}/${{ steps.resolve.outputs.service_name }}"
          docker push "${IMAGE}:${{ github.sha }}"
          docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

      - name: Create the Web App if it doesn't exist yet
        env:
          WEBAPP_NAME: ${{ steps.resolve.outputs.webapp_name }}
          RG: ${{ env.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          if az webapp show --name "$WEBAPP_NAME" --resource-group "$RG" -o none 2>/dev/null; then
            echo "$WEBAPP_NAME already exists — leaving every other Web App untouched, updating only this one."
            exit 0
          fi
          echo "First deploy of this service — creating $WEBAPP_NAME on the shared plan."
          az webapp create \
            --name "$WEBAPP_NAME" \
            --resource-group "$RG" \
            --plan "${{ steps.infra.outputs.plan_name }}" \
            --assign-identity '[system]' \
            -o none

      - name: Wire ACR pull identity and point at the new image
        env:
          WEBAPP_NAME: ${{ steps.resolve.outputs.webapp_name }}
          RG: ${{ env.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          IMAGE="${{ steps.infra.outputs.acr_login_server }}/${{ steps.resolve.outputs.service_name }}:${{ github.sha }}"

          PRINCIPAL_ID="$(az webapp identity show --name "$WEBAPP_NAME" --resource-group "$RG" --query principalId -o tsv 2>/dev/null || true)"
          if [ -z "$PRINCIPAL_ID" ] || [ "$PRINCIPAL_ID" = "None" ]; then
            PRINCIPAL_ID="$(az webapp identity assign --name "$WEBAPP_NAME" --resource-group "$RG" --query principalId -o tsv)"
          fi

          # Scoped to just this resource group — see bootstrap.sh's User
          # Access Administrator grant for why the pipeline is allowed to do
          # this.
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role AcrPull \
            --scope "${{ steps.infra.outputs.acr_id }}" \
            -o none 2>/dev/null || true

          az webapp config set --name "$WEBAPP_NAME" --resource-group "$RG" \
            --acr-use-identity true --acr-identity '[system]' -o none
          az webapp config container set \
            --name "$WEBAPP_NAME" --resource-group "$RG" \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://${{ steps.infra.outputs.acr_login_server }}" \
            -o none
          az webapp config appsettings set --name "$WEBAPP_NAME" --resource-group "$RG" \
            --settings WEBSITES_PORT=8000 PORT=8000 -o none
          az webapp update --name "$WEBAPP_NAME" --resource-group "$RG" \
            --set siteConfig.healthCheckPath='${{ steps.resolve.outputs.health_path }}' -o none
          az webapp restart --name "$WEBAPP_NAME" --resource-group "$RG" -o none

      - name: Health check
        env:
          WEBAPP_NAME: ${{ steps.resolve.outputs.webapp_name }}
        run: |
          set -euo pipefail
          URL="https://${WEBAPP_NAME}.azurewebsites.net${{ steps.resolve.outputs.health_path }}"
          echo "Waiting on $URL"
          for i in $(seq 1 30); do
            if curl -fsS "$URL"; then
              echo
              echo "healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$WEBAPP_NAME did not become healthy at $URL within 5 minutes. If this is its first deploy and it needs a database/API key/etc., that's expected until you push those settings by hand — see infra-personal/README.md."
          exit 1

      - name: Summary
        if: success()
        env:
          WEBAPP_NAME: ${{ steps.resolve.outputs.webapp_name }}
        run: |
          echo "**${{ steps.resolve.outputs.service_name }}** deployed: \`${{ steps.infra.outputs.acr_login_server }}/${{ steps.resolve.outputs.service_name }}:${{ github.sha }}\` -> https://${WEBAPP_NAME}.azurewebsites.net" >> "$GITHUB_STEP_SUMMARY"
