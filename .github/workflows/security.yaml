name: Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    # Weekly re-scan so newly published CVEs surface without a code change.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read  # Gitleaks needs this to enumerate PR commits, else 403
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — a secret added and reverted still counts

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependencies:
    name: Dependency and IaC scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@v4

      # Cached Rego policies go stale against newer Trivy versions and fail the
      # misconfig scanner with confusing rule errors. Always start clean.
      - name: Clear Trivy policy cache
        run: rm -rf "$HOME/.cache/trivy/policy"

      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          # Without this, SARIF output ignores `severity` and reports everything.
          limit-severities-for-sarif: true
        env:
          TRIVY_SKIP_DB_UPDATE: false

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Separate gating pass: SARIF upload above is for visibility, this fails
      # the build. exit-code 1 on CRITICAL/HIGH only — MEDIUM is reported, not blocking.
      # No ignore-unfixed here: these are our own Python and npm dependencies, so
      # an unfixed CRITICAL/HIGH is a decision to make (pin, replace, accept via
      # .trivyignore), not something to hide.
      - name: Trivy gate — fail on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  image:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: facial-biometric-poc:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clear Trivy policy cache
        run: rm -rf "$HOME/.cache/trivy/policy"

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: facial-biometric-poc:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy gate — fail on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: facial-biometric-poc:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Broader than the default suite — matches the org standard.
          queries: security-extended,security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx.json
          output-file: sbom-cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-cyclonedx.json
          retention-days: 90
