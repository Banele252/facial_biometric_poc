# Reverse-proxies the API onto the same origin as the console, so the
# browser makes no cross-origin requests and the backend needs no CORS
# allowance for this app.

resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client bodies here are small JSON reads; cap them.
    client_max_body_size 1m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Runtime config carries the service-account credentials into the
    # browser. Never cache it, anywhere.
    location = /config.js {
        alias /tmp/console/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # Hashed asset filenames — safe to cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- API proxy ----
    # CONSOLE_UPSTREAM is substituted into this file by envsubst at start
    # (see docker-compose). Using a variable forces runtime DNS resolution,
    # so nginx does not fail to start when the API container is not up yet.
    set $upstream "${CONSOLE_UPSTREAM}";

    location /api/ {
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through the zero-trust headers the client sets.
        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /auth/ {
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # SPA fallback — client-side routes like /audit-logs must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
