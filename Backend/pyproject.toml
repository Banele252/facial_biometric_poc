[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM",
]
ignore = [
    "N999",   # Invalid module name (Backend/ has uppercase B)
    "E501",   # Line too long (handled by formatter)
    "B008",   # FastAPI Depends/File/Form in defaults — intentional pattern
    "SIM112", # Legacy lowercase env vars (would break existing .env files)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
