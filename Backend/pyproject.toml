[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "N"]
ignore = [
    "S101",   # assert allowed in tests
    "S106",   # hardcoded password in test fixtures
    "S107",   # hardcoded password in test fixtures
    "B008",   # FastAPI Depends/Form in defaults is standard
    "B904",   # raise from exc — optional in FastAPI handlers
]

[tool.ruff.lint.per-file-ignores]
"Backend/tests/**/*.py" = ["S101", "S106", "S107"]
"Backend/**/test_*.py" = ["S101", "S106", "S107"]
"Backend/sim_swap_service/test_*.py" = ["S101"]

[tool.black]
line-length = 120
target-version = ['py311']